name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 22.12.0 is the engines floor
        node: ["22.12.0", "24", "26"]
        include:
          - os: windows-latest
            node: "26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Run the packed tarball via npx without our lockfile, like an npx user
      # would, and render the init template
      - name: Smoke test packed package
        shell: bash
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          cd "$RUNNER_TEMP"
          npx --yes --package "./$tarball" cv init data
          npx --yes --package "./$tarball" cv create cv.pdf --data-project data
          head -c 5 cv.pdf | grep -q '%PDF-'
